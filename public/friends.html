<!-- public/friends.html -->
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Мои друзья | MySocial</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="header">
        <div class="header__content">
            <div class="header__logo">MySocial</div>
            <div class="header__user-info">
                <span id="currentUsername" class="skeleton skeleton--medium"> </span>
                <button id="logoutBtn" class="header__logout-btn" style="display: none;">Выйти</button>
            </div>
        </div>
    </div>

    <div class="container">
        <aside class="main-layout__sidebar">
            <nav class="menu">
                <ul class="menu__list">
                    <li class="menu__item"><a href="/" class="menu__link spa-link">Моя страница</a></li>
                    <li class="menu__item"><a href="/friends" class="menu__link spa-link menu__link--active">Мои друзья</a></li>
                    <li class="menu__item">
                        <a href="/dialogs" class="menu__link spa-link">
                            Мои сообщения
                            <span class="badge" id="unreadBadge" style="display: none;">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="content" id="main-content">
            <div class="friends-page">
                <div class="friends-header">
                    <h1 class="friends-header__title">Мои друзья</h1>
                </div>

                <div class="friends-layout">
                    <div class="friends-list-section">
                        <div class="friends-filters">
                            <button class="friends-filter-btn friends-filter-btn--active" data-tab="friends">Друзья</button>
                            <button class="friends-filter-btn" data-tab="requests">Заявки в друзья</button>
                        </div>

                        <div class="friends-list" id="friendsList">
                            <!-- Список друзей будет загружен через JavaScript -->
                            <div class="friends-list__empty">
                                <p>У вас пока нет друзей</p>
                            </div>
                        </div>
                    </div>

                    <div class="friends-sidebar">
                        <div class="friends-sidebar__menu">
                            <ul class="friends-menu">
                                <li class="friends-menu__item">
                                    <a href="#" class="friends-menu__link friends-menu__link--active" data-tab="friends">Друзья</a>
                                </li>
                                <li class="friends-menu__item">
                                    <a href="#" class="friends-menu__link" data-tab="requests">Заявки в друзья</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Убрали все внешние скрипты из этого файла, т.к. они будут загружаться через SPA -->
</body>

</html>
