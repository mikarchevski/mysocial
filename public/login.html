<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | MySocial</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <h1 class="auth-card__title">Вход в MySocial</h1>
                
                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" id="password" name="password" class="form-input" required>
                    </div>
                    
                    <div class="form-group form-group--checkbox">
                        <input type="checkbox" id="rememberMe" name="rememberMe" class="form-checkbox">
                        <label for="rememberMe" class="form-label form-label--inline">Запомнить меня</label>
                    </div>
                    
                    <button type="submit" class="form-button">Войти</button>
                    
                    <div class="form-error" id="errorMessage"></div>
                </form>
                
                <div class="auth-card__footer">
                    <p>Нет аккаунта? <a href="/register" class="auth-link">Зарегистрироваться</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            data.rememberMe = formData.get('rememberMe') === 'on';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data),
                    credentials: 'include'
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    document.getElementById('errorMessage').textContent = result.error;
                    document.getElementById('errorMessage').style.display = 'block';
                }
            } catch (error) {
                document.getElementById('errorMessage').textContent = 'Произошла ошибка при входе';
                document.getElementById('errorMessage').style.display = 'block';
            }
        });
    </script>
</body>
</html>
