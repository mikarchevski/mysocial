<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация | MySocial</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="regForm-page">
    <div class="regForm-container">
        <div class="regForm">
            <!-- Табы для переключения -->
            <div class="regForm-tabs">
                <button class="regForm-tab regForm-tab--active" data-tab="login">Вход</button>
                <button class="regForm-tab" data-tab="register">Регистрация</button>
            </div>

            <!-- Форма входа -->
            <div class="regForm-form-wrapper regForm-form-wrapper--active" id="regForm-loginFormWrapper">
                <h1 class="regForm__title">Вход в MySocial</h1>
                <form id="regForm-loginForm" class="regForm__form">
                    <div class="regForm__group">
                        <label for="regForm-loginEmail" class="regForm__label">Email</label>
                        <input type="email" id="regForm-loginEmail" name="email" class="regForm__input" required
                            autocomplete="username">
                    </div>
                    <div class="regForm__group">
                        <label for="regForm-loginPassword" class="regForm__label">Пароль</label>
                        <input type="password" id="regForm-loginPassword" name="password" class="regForm__input"
                            required autocomplete="current-password">
                    </div>
                    <div class="regForm__group regForm__group--checkbox">
                        <input type="checkbox" id="regForm-rememberMe" name="rememberMe" class="regForm__checkbox">
                        <label for="regForm-rememberMe" class="regForm__label regForm__label--inline">Запомнить
                            меня</label>
                    </div>
                    <div id="regForm-loginError" class="regForm__error"></div>
                    <button type="submit" class="regForm__button">Войти</button>
                </form>
            </div>

            <!-- Форма регистрации -->
            <div class="regForm-form-wrapper" id="regForm-registerFormWrapper">
                <h1 class="regForm__title">Регистрация в MySocial</h1>
                <form id="regForm-registerForm" class="regForm__form">
                    <div class="regForm__row">
                        <div class="regForm__group">
                            <label for="regForm-firstName" class="regForm__label">Имя *</label>
                            <input type="text" id="regForm-firstName" name="firstName" class="regForm__input" required>
                        </div>
                        <div class="regForm__group">
                            <label for="regForm-lastName" class="regForm__label">Фамилия *</label>
                            <input type="text" id="regForm-lastName" name="lastName" class="regForm__input" required>
                        </div>
                    </div>
                    <div class="regForm__group">
                        <label for="regForm-dateOfBirth" class="regForm__label">Дата рождения *</label>
                        <input type="date" id="regForm-dateOfBirth" name="dateOfBirth" class="regForm__input" required>
                    </div>
                    <div class="regForm__group">
                        <label for="regForm-city" class="regForm__label">Город</label>
                        <input type="text" id="regForm-city" name="city" class="regForm__input"
                            placeholder="Необязательно">
                    </div>
                    <div class="regForm__group">
                        <label for="regForm-registerEmail" class="regForm__label">Email *</label>
                        <input type="email" id="regForm-registerEmail" name="email" class="regForm__input" required
                            autocomplete="username">
                    </div>
                    <div class="regForm__row">
                        <div class="regForm__group">
                            <label for="regForm-registerPassword" class="regForm__label">Пароль *</label>
                            <input type="password" id="regForm-registerPassword" name="password" class="regForm__input"
                                required minlength="6" autocomplete="new-password">
                        </div>
                        <div class="regForm__group">
                            <label for="regForm-confirmPassword" class="regForm__label">Повторите пароль *</label>
                            <input type="password" id="regForm-confirmPassword" name="confirmPassword"
                                class="regForm__input" required minlength="6" autocomplete="new-password">
                        </div>
                    </div>
                    <div id="regForm-registerError" class="regForm__error"></div>
                    <button type="submit" class="regForm__button">Зарегистрироваться</button>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/crypto.js"></script>
    <script src="/js/auth.js"></script>
</body>

</html>
