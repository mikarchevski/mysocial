<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | MySocial</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Внешние обертки также с префиксом regForm -->
    <div class="regForm-page">
        <div class="regForm-container">
            
            <!-- Основной блок БЭМ -->
            <div class="regForm">
                <h1 class="regForm__title">Создать аккаунт</h1>
                
                <form class="regForm__form" id="regForm">
                    <div class="regForm__row">
                        <div class="regForm__group">
                            <label for="regForm-firstName" class="regForm__label">Имя</label>
                            <input type="text" id="regForm-firstName" name="firstName" class="regForm__input" required>
                        </div>
                        <div class="regForm__group">
                            <label for="regForm-lastName" class="regForm__label">Фамилия</label>
                            <input type="text" id="regForm-lastName" name="lastName" class="regForm__input" required>
                        </div>
                    </div>
                    
                    <div class="regForm__group">
                        <label for="regForm-email" class="regForm__label">Email</label>
                        <input type="email" id="regForm-email" name="email" class="regForm__input" required>
                    </div>
                    
                    <div class="regForm__group">
                        <label for="regForm-dateOfBirth" class="regForm__label">Дата рождения</label>
                        <input type="date" id="regForm-dateOfBirth" name="dateOfBirth" class="regForm__input" required>
                    </div>
                    
                    <div class="regForm__group">
                        <label for="regForm-city" class="regForm__label">Город</label>
                        <input type="text" id="regForm-city" name="city" class="regForm__input">
                    </div>
                    
                    <div class="regForm__row">
                        <div class="regForm__group">
                            <label for="regForm-password" class="regForm__label">Пароль</label>
                            <input type="password" id="regForm-password" name="password" class="regForm__input" required>
                        </div>
                        <div class="regForm__group">
                            <label for="regForm-confirmPassword" class="regForm__label">Подтвердите пароль</label>
                            <input type="password" id="regForm-confirmPassword" name="confirmPassword" class="regForm__input" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="regForm__button">Зарегистрироваться</button>
                    
                    <div class="regForm__error" id="regForm-errorMessage"></div>
                </form>
                
                <div class="regForm__footer">
                    <p>Уже есть аккаунт? <a href="/login" class="regForm__link">Войти</a></p>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        // Обновлены ID в скрипте
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            // Кэшируем элемент ошибки, чтобы не искать его в DOM дважды
            const errorElement = document.getElementById('regForm-errorMessage');

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data),
                    credentials: 'include'
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    window.location.href = '/';
                } else {
                    errorElement.textContent = result.error;
                    errorElement.style.display = 'block';
                }
            } catch (error) {
                errorElement.textContent = 'Произошла ошибка при регистрации';
                errorElement.style.display = 'block';
            }
        });
    </script>
</body>
</html>
