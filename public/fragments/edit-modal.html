<!-- public/fragments/edit-modal.html -->
<div class="profile-editor__overlay" id="profileEditorModal" style="display: none;">
  <div class="profile-editor__modal">
    
    <div class="profile-editor__header">
      <h3 class="profile-editor__title">Редактирование профиля</h3>
      <button type="button" class="profile-editor__close" id="profileEditorCloseBtn" aria-label="Закрыть">&times;</button>
    </div>

    <form id="profileEditorForm" class="profile-editor__form">
      
      <div class="profile-editor__group">
        <label class="profile-editor__label" for="editCity">Город</label>
        <input type="text" id="editCity" class="profile-editor__input" placeholder="Введите город">
      </div>

      <div class="profile-editor__group">
        <label class="profile-editor__label" for="editPhone">Телефон</label>
        <input type="tel" id="editPhone" class="profile-editor__input" placeholder="+7 (999) 123-45-67">
      </div>

      <div class="profile-editor__group">
        <label class="profile-editor__label" for="editWebsite">Сайт</label>
        <input type="url" id="editWebsite" class="profile-editor__input" placeholder="https://example.com">
      </div>
      <div class="profile-editor__group">
        <label class="profile-editor__label" for="editGender">Пол</label>
        <select id="editGender" class="profile-editor__input">
          <option value="">Не указано</option>
          <option value="Мужской">Мужской</option>
          <option value="Женский">Женский</option>
        </select>
      </div>
      <div class="profile-editor__group">
        <label class="profile-editor__label" for="editFamily">Семейное положение</label>
        <select id="editFamily" class="profile-editor__input">
          <option value="">Не указано</option>
          <option value="Не женат / Не замужем">Не женат / Не замужем</option>
          <option value="Встречаюсь">Встречаюсь</option>
          <option value="Помолвлен(а)">Помолвлен(а)</option>
          <option value="Женат / Замужем">Женат / Замужем</option>
          <option value="Всё сложно">Всё сложно</option>
        </select>
      </div>

      <div class="profile-editor__group">
        <label class="profile-editor__label" for="editAbout">О себе</label>
        <textarea id="editAbout" class="profile-editor__input profile-editor__input--textarea" rows="3" placeholder="Расскажите о себе"></textarea>
      </div>

      <div class="profile-editor__actions">
        <button type="button" class="profile-editor__button profile-editor__button--cancel" id="profileEditorCancelBtn">Отмена</button>
        <button type="submit" class="profile-editor__button profile-editor__button--save">Сохранить</button>
      </div>

    </form>
  </div>
</div>
