<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сообщения | MySocial</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="header">
        <div class="header__content">
            <div class="header__logo">MySocial</div>
            <div class="header__user-info">
                <span id="currentUsername">Гость</span>
                <button id="logoutBtn" class="header__logout-btn" style="display: none;">Выйти</button>
            </div>
        </div>
    </div>

    <div class="container">
        <aside class="sidebar">
            <nav class="menu">
                <ul class="menu__list">
                    <li class="menu__item"><a href="/" class="menu__link">Моя страница</a></li>
                    <li class="menu__item"><a href="#" class="menu__link">Мои друзья</a></li>
                    <li class="menu__item">
                        <a href="/dialogs" class="menu__link menu__link">
                            Мои сообщения
                            <span class="badge" id="unreadBadge" style="display: none;">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="content">
            <div class="dialogs-container">
                <!-- Табы -->
                <div class="dialogs-tabs">
                    <button class="dialogs-tab dialogs-tab--active" data-tab="list">Диалоги</button>
                    <button class="dialogs-tab" data-tab="view">Просмотр диалогов</button>
                </div>

                <!-- Контент табов -->
                <div class="dialogs-content">
                    <!-- Таб 1: Список диалогов -->
                    <div class="dialogs-tab-content dialogs-tab-content--active" id="tab-list">
                        <div class="dialogs-header">
                            <input type="text" class="dialogs-search" placeholder="Поиск..." id="searchInput">
                            <button class="dialogs-btn" id="newMessageBtn">+ Написать</button>
                        </div>
                        <div class="dialogs-filter">
                            <button class="filter-btn filter-btn--active" data-filter="all">Все</button>
                            <button class="filter-btn" data-filter="unread">Непрочитанные</button>
                        </div>
                        <div class="dialogs-list" id="dialogsList">
                            <!-- Диалоги загружаются через JS -->
                        </div>
                    </div>

                    <!-- Таб 2: Просмотр диалогов -->
                    <div class="dialogs-tab-content" id="tab-view">
                        <div class="open-dialogs-list" id="openDialogsList">
                            <!-- Открытые диалоги добавляются сюда -->
                            <div class="empty-state">
                                <p>Выберите диалог из списка, чтобы открыть его здесь</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Модалка для нового сообщения -->
    <div class="modal" id="newMessageModal" style="display: none;">
        <div class="modal__content">
            <h3>Новое сообщение</h3>
            <input type="text" class="form-input" placeholder="Введите имя пользователя..." id="searchUserInput">
            <div class="search-results" id="searchResults"></div>
            <button class="modal__close" id="closeModal">Закрыть</button>
        </div>
    </div>

    <script src="/js/sidebar.js"></script>
    <script src="/js/dialogs.js"></script>
</body>
</html>
