<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>MySocial</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="header">
        <div class="header__content">

            <div class="header__logo">MySocial</div>
            <div class="header__user-info">
                <div class="header__search-container">
                    <button class="header__search-btn" id="searchToggleBtn">
                        <svg class="header__search-icon" id="searchIcon" width="20" height="20" viewBox="0 0 24 24"
                            fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2" />
                            <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" />
                        </svg>
                    </button>
                    <input type="text" class="header__search-input" id="searchInput" placeholder="Поиск...">
                    <button type="button" id="headerSearchClear" class="header__search-clear"
                        aria-label="Очистить поиск">&times;</button>

                </div>
                <span id="currentUsername" class="skeleton skeleton--medium"></span>
                <button id="logoutBtn" class="header__logout-btn" style="display: none;">Выйти</button>
            </div>
        </div>
    </div>

    <div class="container">
        <aside class="main-layout__sidebar">
            <nav class="side-menu">
                <ul class="side-menu__list">
                    <li class="side-menu__item">
                        <a href="" class="side-menu__link spa-link" id="myPageLink">Моя страница</a>
                        <button class="side-menu__edit-btn" id="editProfileBtn" style="display: none;"
                            title="Редактировать профиль">Ред.</button>
                    </li>
                    <li class="side-menu__item">
                        <a href="/friends" class="side-menu__link spa-link">
                            Мои друзья
                            <span class="side-menu__badge" id="friendRequestsBadge" style="display: none;">0</span>
                        </a>
                    </li>
                    <li class="side-menu__item">
                        <a href="/dialogs" class="side-menu__link spa-link">
                            Мои сообщения
                            <span class="side-menu__badge" id="unreadBadge" style="display: none;">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="content" id="main-content">
            <!-- Сюда роутер вставит фрагмент -->
            <div class="loading">Загрузка...</div>
        </main>
    </div>

    <!-- 1. Утилиты безопасности -->
    <script src="/js/utils/sanitize.js" type="module"></script>
    <!-- 2. Потом логика сайдбара и роутера -->
    <script src="/js/sidebar.js"></script>
    <script src="/js/spa-router.js"></script>

    <script src="/js/crypto.js"></script>
    <script src="/js/dialogs.js"></script>
    <!-- 3. Потом логика конкретных страниц (они будут загружены динамически, но порядок важен) -->
    <script src="/js/profile.js"></script>
    <script src="/js/friends.js"></script>
    <script src="/js/dialogs.js"></script>

    <!-- 4. Точка входа -->
    <script src="/js/app.js"></script>
</body>

</html>
