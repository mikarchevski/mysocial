<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>MySocial</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="header">
        <div class="header__content">
            <div class="header__logo">MySocial</div>
            <div class="header__user-info">
                <span id="currentUsername" class="skeleton skeleton--medium"></span>
                <button id="logoutBtn" class="header__logout-btn" style="display: none;">Выйти</button>
            </div>
        </div>
    </div>

    <div class="container">
        <aside class="main-layout__sidebar">
            <nav class="side-menu">
                <ul class="side-menu__list">
                    <li class="side-menu__item">
                        <a href="" class="side-menu__link spa-link" id="myPageLink">Моя страница</a>
                        <button class="side-menu__edit-btn" id="editProfileBtn" style="display: none;"
                            title="Редактировать профиль">Ред.</button>
                    </li>
                    <li class="side-menu__item">
                        <a href="/friends" class="side-menu__link spa-link">
                            Мои друзья
                            <span class="side-menu__badge" id="friendRequestsBadge" style="display: none;">0</span>
                        </a>
                    </li>
                    <li class="side-menu__item">
                        <a href="/dialogs" class="side-menu__link spa-link">
                            Мои сообщения
                            <span class="side-menu__badge" id="unreadBadge" style="display: none;">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="content" id="main-content">
            <!-- Сюда роутер вставит фрагмент -->
            <div class="loading">Загрузка...</div>
        </main>
    </div>

    <!-- Модальные окна (общие для всего приложения) -->
    <div class="modal-overlay" id="editModal" style="display: none;">
        <!-- содержимое модалки редактирования -->
    </div>

    <!-- 2. Потом логика сайдбара и роутера -->
    <script src="/js/sidebar.js"></script>
    <script src="/js/spa-router.js"></script>

    <!-- 3. Потом логика конкретных страниц (они будут загружены динамически, но порядок важен) -->
    <script src="/js/profile.js"></script>
    <script src="/js/friends.js"></script>
    <script src="/js/dialogs.js"></script>

    <!-- 4. Точка входа -->
    <script src="/js/app.js"></script>
</body>

</html>
