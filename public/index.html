<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Профиль пользователя | MySocial</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="header">
        <div class="header__content">
            <div class="header__logo">MySocial</div>
            <div class="header__user-info">
                <span id="currentUsername">Гость</span>
                <button id="logoutBtn" class="header__logout-btn" style="display: none;">Выйти</button>
            </div>
        </div>
    </div>

    <div class="container">
        <aside class="sidebar">
            <nav class="menu">
                <ul class="menu__list">
                    <li class="menu__item"><a href="/" class="menu__link">Моя страница</a>
                        <button class="menu__edit-btn" id="editProfileBtn" style="display: none;"
                            title="Редактировать профиль">Ред.</button>
                    </li>

                    <li class="menu__item"><a href="#" class="menu__link">Мои друзья</a></li>
                    <li class="menu__item">
                        <a href="/dialogs" class="menu__link spa-link">
                            Мои сообщения
                            <span class="badge" id="unreadBadge" style="display: none;">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="content" id="main-content">
            <div class="profile-card">
                <div class="avatar-section">
                    <div class="avatar-section__container">
                        <img src="/images/default-avatar.svg" alt="Аватар" class="avatar-section__img" id="userAvatar">
                    </div>
                </div>

                <div class="profile-info-section">
                    <div class="profile-info-section__header">
                        <div class="profile-info-section__info">
                            <h1 class="profile-info-section__name" id="profileName">Загрузка...</h1>
                        </div>
                    </div>

                    <div class="profile-info-section__details">
                        <!-- Пол -->
                        <div class="info-block__row">
                            <span class="info-block__label">Пол</span>
                            <span class="info-block__value" id="userGender">Не указан</span>
                        </div>

                        <!-- Город -->
                        <div class="info-block__row">
                            <span class="info-block__label">
                                <svg class="info-block__row-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2">
                                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                                    <circle cx="12" cy="10" r="3" />
                                </svg>
                                Город
                            </span>
                            <span class="info-block__value" id="userCity">Не указан</span>
                        </div>

                        <!-- Дата рождения -->
                        <div class="info-block__row">
                            <span class="info-block__label">
                                <svg class="info-block__row-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                    <line x1="16" y1="2" x2="16" y2="6" />
                                    <line x1="8" y1="2" x2="8" y2="6" />
                                    <line x1="3" y1="10" x2="21" y2="10" />
                                </svg>
                                Дата рождения
                            </span>
                            <span class="info-block__value" id="userBirthday">Не указана</span>
                        </div>

                        <!-- О себе -->
                        <div class="info-block__row">
                            <span class="info-block__label">
                                <svg class="info-block__row-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                                    <polyline points="14 2 14 8 20 8" />
                                    <line x1="16" y1="13" x2="8" y2="13" />
                                    <line x1="16" y1="17" x2="8" y2="17" />
                                </svg>
                                О себе
                            </span>
                            <span class="info-block__value" id="userAbout">Не указано</span>
                        </div>

                        <!-- Блок "Информация" с контактной информацией -->
                        <div class="info-block">
                            <h3 class="info-block__title">
                                Информация
                            </h3>

                            <!-- Контактная информация -->
                            <div class="info-block__subtitle">Контактная информация</div>

                            <!-- Email -->
                            <div class="info-block__row">
                                <span class="info-block__label">
                                    <svg class="info-block__row-icon" width="14" height="14" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2">
                                        <path
                                            d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                        <polyline points="22,6 12,13 2,6" />
                                    </svg>
                                    Email
                                </span>
                                <span class="info-block__value" id="userEmail">Не указан</span>
                            </div>

                            <!-- Телефон -->
                            <div class="info-block__row">
                                <span class="info-block__label">
                                    <svg class="info-block__row-icon" width="14" height="14" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2">
                                        <path
                                            d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />
                                    </svg>
                                    Телефон
                                </span>
                                <span class="info-block__value" id="userPhone">Не указан</span>
                            </div>

                            <!-- Сайт -->
                            <div class="info-block__row">
                                <span class="info-block__label">
                                    <svg class="info-block__row-icon" width="14" height="14" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10" />
                                        <line x1="2" y1="12" x2="22" y2="12" />
                                        <path
                                            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                                    </svg>
                                    Сайт
                                </span>
                                <span class="info-block__value" id="userWebsite">Не указан</span>
                            </div>
                        </div>
                    </div>

                    <!-- Стена -->
                    <div class="wall">
                        <div class="wall__header">
                            <h2 class="wall__title">Стена</h2>
                        </div>

                        <div class="wall__new-post" id="wallNewPost">
                            <div class="wall__new-post-avatar">
                                <img src="/images/default-avatar.svg" alt="Аватар">
                            </div>
                            <div class="wall__new-post-content">
                                <textarea class="wall__textarea" id="wallTextarea"
                                    placeholder="Что у Вас нового?"></textarea>
                                <div class="wall__new-post-footer">
                                    <div class="wall__attachments">
                                        <button class="wall__attach-btn" title="Фото">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="2">
                                                <rect x="3" y="3" width="18" height="18" rx="2" />
                                                <circle cx="8.5" cy="8.5" r="1.5" />
                                                <path d="M21 15l-5-5L5 21" />
                                            </svg>
                                        </button>
                                        <button class="wall__attach-btn" title="Видео">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="2">
                                                <polygon points="23 7 16 12 23 17 23 7" />
                                                <rect x="1" y="5" width="15" height="14" rx="2" />
                                            </svg>
                                        </button>
                                        <button class="wall__attach-btn" title="Аудио">
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                                                stroke="currentColor" stroke-width="2">
                                                <path d="M9 18V5l12-2v13" />
                                                <circle cx="6" cy="18" r="3" />
                                                <circle cx="18" cy="16" r="3" />
                                            </svg>
                                        </button>
                                    </div>
                                    <button class="wall__submit-btn" id="wallSubmitBtn">Опубликовать</button>
                                </div>
                            </div>
                        </div>

                        <div class="wall__filters">
                            <button class="wall__filter-btn wall__filter-btn--active" data-filter="all">Все
                                записи</button>
                            <button class="wall__filter-btn" data-filter="owner">Записи пользователя</button>
                        </div>

                        <div class="wall__posts" id="wallPosts">
                            <div class="wall__empty">
                                <p>Пока нет записей на стене</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Модальное окно редактирования -->
            <div class="modal-overlay" id="editModal" style="display: none;">
                <div class="modal">
                    <div class="modal__header">
                        <h3 class="modal__title">Редактирование профиля</h3>
                        <button class="modal__close" id="closeEditModal">&times;</button>
                    </div>
                    <form id="editProfileForm" class="modal__form">
                        <div class="form-group">
                            <label class="form-label" for="editCity">Город</label>
                            <input type="text" id="editCity" class="form-input" placeholder="Введите город">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="editPhone">Телефон</label>
                            <input type="tel" id="editPhone" class="form-input" placeholder="+7 (999) 123-45-67">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="editWebsite">Сайт</label>
                            <input type="url" id="editWebsite" class="form-input" placeholder="https://example.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="editFamily">Семейное положение</label>
                            <select id="editFamily" class="form-input">
                                <option value="">Не указано</option>
                                <option value="Не женат / Не замужем">Не женат / Не замужем</option>
                                <option value="Встречаюсь">Встречаюсь</option>
                                <option value="Помолвлен(а)">Помолвлен(а)</option>
                                <option value="Женат / Замужем">Женат / Замужем</option>
                                <option value="Всё сложно">Всё сложно</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="editAbout">О себе</label>
                            <textarea id="editAbout" class="form-input" rows="3"
                                placeholder="Расскажите о себе"></textarea>
                        </div>
                        <div class="modal__actions">
                            <button type="button" class="modal__btn modal__btn--cancel" id="cancelEdit">Отмена</button>
                            <button type="submit" class="modal__btn modal__btn--save">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/profile.js"></script>
    <script src="/js/spa-router.js"></script>
    <script src="/js/sidebar.js"></script>
    <script src="/js/dialogs.js"></script>
</body>

</html>
