<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Профиль пользователя | MySocial</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="header">
        <div class="header__content">
            <div class="header__logo">MySocial</div>
            <div class="header__user-info">
                <span id="currentUsername">Гость</span>
                <button id="logoutBtn" class="header__logout-btn" style="display: none;">Выйти</button>
            </div>
        </div>
    </div>

    <div class="container">
        <aside class="sidebar">
            <nav class="menu">
                <ul class="menu__list">
                    <li class="menu__item"><a href="/" class="menu__link">Моя страница</a></li>
                    <li class="menu__item"><a href="#" class="menu__link">Мои друзья</a></li>
                    <li class="menu__item"><a href="#" class="menu__link">Мои сообщения</a></li>
                </ul>
            </nav>
        </aside>

        <main class="content">
            <div class="profile-card">
                <div class="avatar-section">
                    <div class="avatar-section__container">
                        <img src="/images/default-avatar.svg" alt="Аватар" class="avatar-section__img" id="userAvatar">
                    </div>
                </div>

                <div class="profile-info-section">
                    <div class="profile-info-section__header">
                        <div class="profile-info-section__info">
                            <h1 class="profile-info-section__name" id="profileName">Загрузка...</h1>
                            <p class="profile-info-section__status">ID: <span id="profileId">...</span></p>
                        </div>
                    </div>

                    <div class="profile-info-section__details">
                        <div class="info-block">
                            <h3 class="info-block__title">Общая информация</h3>
                            <div class="info-block__row">
                                <span class="info-block__label">Город:</span>
                                <span class="info-block__value" id="userCity">Не указан</span>
                            </div>
                            <div class="info-block__row">
                                <span class="info-block__label">Дата рождения:</span>
                                <span class="info-block__value" id="userBirthday">Не указана</span>
                            </div>
                        </div>

                        <div class="info-block">
                            <h3 class="info-block__title">Контактная информация</h3>
                            <div class="info-block__row">
                                <span class="info-block__label">Email:</span>
                                <span class="info-block__value" id="userEmail">Не указан</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/profile.js"></script>
</body>
</html>
